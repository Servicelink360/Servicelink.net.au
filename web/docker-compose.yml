services:
  postgres:
    image: postgres:16-alpine
    container_name: servicelink-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: servicelink
      POSTGRES_PASSWORD: servicelink
      POSTGRES_DB: servicelink
    volumes:
      - servicelink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicelink -d servicelink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servicelink_pg_data:
