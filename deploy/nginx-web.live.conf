# Apex → www (canonical host)
server {
    listen 80;
    listen [::]:80;
    server_name servicelink.net.au;
    return 301 https://www.servicelink.net.au$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name servicelink.net.au;

    ssl_certificate /etc/letsencrypt/live/servicelink.net.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servicelink.net.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.servicelink.net.au$request_uri;
}

# Canonical www site
server {
    listen 80;
    listen [::]:80;
    server_name www.servicelink.net.au;
    return 301 https://www.servicelink.net.au$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name www.servicelink.net.au;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/servicelink.net.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servicelink.net.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /uploads/ {
        alias /var/www/servicelink/web/public/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
